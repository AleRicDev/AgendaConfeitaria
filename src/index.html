
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Doce Gestão</title>

  <!-- Ícones Tabler -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
  >
</head>

<body>

  <div class="app-shell">
    <div class="main-layout">

      <!-- CABEÇALHO PRINCIPAL -->
      <header class="topbar">
        <div class="topbar-inner">

          <!-- MARCA -->
          <a
            href="#agenda"
            class="topbar-brand"
            aria-label="Doce Gestão - Ir para agenda"
          >
            <span class="topbar-brand-icon" aria-hidden="true">
              <i class="ti ti-cake"></i>
            </span>

            <span class="topbar-brand-text">
              <strong class="topbar-brand-name">
                Doce Gestão
              </strong>

              <span class="topbar-brand-subtitle">
                Agenda de encomendas
              </span>
            </span>
          </a>

          <!-- NAVEGAÇÃO DE DATAS -->
          <nav
            class="date-navigation"
            aria-label="Navegação entre datas"
          >

            <button
              type="button"
              class="btn btn-outline date-nav-button"
              id="previous-day-button"
              aria-label="Dia anterior"
            >
              <i class="ti ti-chevron-left" aria-hidden="true"></i>
            </button>

            <div class="date-navigation-control">

              <label for="agenda-date">
                Data selecionada
              </label>

              <input
                type="date"
                id="agenda-date"
              >

              <p id="agenda-date-label"></p>

            </div>

            <button
              type="button"
              class="btn btn-outline date-nav-button"
              id="next-day-button"
              aria-label="Próximo dia"
            >
              <i class="ti ti-chevron-right" aria-hidden="true"></i>
            </button>

            <button
              type="button"
              class="btn btn-outline date-today-button"
              id="today-button"
            >
              Hoje
            </button>

          </nav>

          <!-- NOVA ENCOMENDA -->
          <div class="topbar-actions">

            <button
              type="button"
              class="btn btn-primary"
              id="new-production-button"
            >
              <i class="ti ti-plus" aria-hidden="true"></i>
              Nova encomenda
            </button>

          </div>

        </div>
      </header>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="content" id="agenda">

        <div class="agenda-page">

          <!-- GRID DESKTOP -->
          <div class="agenda-grid">

            <!-- COLUNA PRINCIPAL: AGENDA -->
            <section
              class="agenda-main"
              aria-labelledby="agenda-title"
            >

              <div class="agenda-heading">

                <h1 id="agenda-title">
                  Agenda do dia
                </h1>

                <p>
                  Encomendas organizadas por horário de entrega.
                </p>

              </div>

              <!-- CARREGAMENTO E ERROS -->
              <p
                id="agenda-feedback"
                class="agenda-feedback"
                role="status"
                aria-live="polite"
                hidden
              ></p>

              <!-- PERÍODOS -->
              <div class="agenda-periods">

                <!-- MANHÃ -->
                <section
                  class="card agenda-period"
                  aria-labelledby="morning-title"
                >

                  <header class="agenda-period-header">

                    <h2 id="morning-title">
                      <i
                        class="ti ti-sunrise"
                        aria-hidden="true"
                      ></i>
                      Manhã
                    </h2>

                    <span>
                      05:00 às 11:59
                    </span>

                  </header>

                  <!-- Cartões criados pelo show.ts -->
                  <div
                    class="list"
                    id="morning-list"
                  ></div>

                </section>

                <!-- TARDE -->
                <section
                  class="card agenda-period"
                  aria-labelledby="afternoon-title"
                >

                  <header class="agenda-period-header">

                    <h2 id="afternoon-title">
                      <i
                        class="ti ti-sun"
                        aria-hidden="true"
                      ></i>
                      Tarde
                    </h2>

                    <span>
                      12:00 às 17:59
                    </span>

                  </header>

                  <div
                    class="list"
                    id="afternoon-list"
                  ></div>

                </section>

                <!-- NOITE -->
                <section
                  class="card agenda-period"
                  aria-labelledby="night-title"
                >

                  <header class="agenda-period-header">

                    <h2 id="night-title">
                      <i
                        class="ti ti-moon"
                        aria-hidden="true"
                      ></i>
                      Noite
                    </h2>

                    <span>
                      18:00 às 04:59
                    </span>

                  </header>

                  <div
                    class="list"
                    id="night-list"
                  ></div>

                </section>

              </div>

            </section>

            <!-- COLUNA SECUNDÁRIA: INDICADORES -->
            <aside
              class="agenda-aside"
              aria-label="Indicadores da agenda"
            >

              <!-- PROGRESSO DIÁRIO -->
              <section
                class="card daily-progress"
                id="daily-progress"
                aria-labelledby="daily-progress-title"
                hidden
              >

                <div class="daily-progress-header">

                  <div>

                    <h2 id="daily-progress-title">
                      Progresso do dia
                    </h2>

                    <p id="daily-progress-summary">
                      0 de 0 encomendas concluídas
                    </p>

                  </div>

                  <strong id="daily-progress-percentage">
                    0%
                  </strong>

                </div>

                <div
                  class="daily-progress-track"
                  id="daily-progress-track"
                  role="progressbar"
                  aria-label="Progresso das encomendas do dia"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >

                  <div
                    class="daily-progress-fill"
                    id="daily-progress-fill"
                  ></div>

                </div>

              </section>

            </aside>

          </div>

        </div>

      </main>

    </div>
  </div>

  <!-- MODAL CENTRALIZADO -->
  <div
    class="modal"
    id="production-modal"
  >

    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="production-modal-title"
    >

      <!-- CABEÇALHO DO MODAL -->
      <header class="modal-header">

        <h2 id="production-modal-title">
          Nova encomenda
        </h2>

        <button
          type="button"
          class="icon-button"
          id="production-modal-close"
          aria-label="Fechar modal"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>

      </header>

      <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO -->
      <form id="production-form">

        <!-- CLIENTE -->
        <div class="form-group">

          <label for="client">
            Cliente
          </label>

          <input
            type="text"
            id="client"
            name="client"
            required
          >

        </div>

        <!-- ITENS DA ENCOMENDA -->
        <div class="form-group">

          <label>
            Itens da encomenda
          </label>

          <!--
            As linhas de produtos são criadas
            dinamicamente pelo modal.ts.
          -->
          <div id="production-items"></div>

          <button
            type="button"
            id="add-item-button"
            class="btn btn-outline"
          >
            <i class="ti ti-plus" aria-hidden="true"></i>
            Adicionar produto
          </button>

        </div>

        <!-- DATA DE ENTREGA -->
        <div class="form-group">

          <label for="delivery-date">
            Data de entrega
          </label>

          <input
            type="date"
            id="delivery-date"
            name="deliveryDate"
            required
          >

        </div>

        <!-- HORÁRIO DE ENTREGA -->
        <div class="form-group">

          <label for="delivery-time">
            Horário de entrega
          </label>

          <input
            type="time"
            id="delivery-time"
            name="deliveryTime"
            required
          >

        </div>

        <!-- VALOR TOTAL -->
        <div class="form-group">

          <label for="total-value">
            Valor total da encomenda (R$)
          </label>

          <input
            type="text"
            id="total-value"
            name="totalValue"
            inputmode="decimal"
            value="0,00"
            placeholder="0,00"
            autocomplete="off"
            required
          >

        </div>

        <!-- OBSERVAÇÕES -->
        <div class="form-group">

          <label for="notes">
            Observações
          </label>

          <textarea
            id="notes"
            name="notes"
          ></textarea>

        </div>

        <!-- MENSAGEM DE ERRO -->
        <p
          id="production-form-error"
          class="form-error"
          role="alert"
          hidden
        >
          Não foi possível salvar a encomenda.
        </p>

        <!-- BOTÕES DO FORMULÁRIO -->
        <div class="modal-actions">

          <button
            type="button"
            class="btn btn-outline"
            id="production-modal-cancel"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Salvar encomenda
          </button>

        </div>

      </form>

    </div>

  </div>

</body>
</html>
